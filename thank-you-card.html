<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Jiya — Printable Thank You Card</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Dancing+Script:wght@600;700&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet" />
<style>
  :root {
    --terracotta: #C97C5D;
    --blush: #E0A085;
    --sage: #9CAA85;
    --cocoa: #4A3F35;
    --taupe: #7A6A5A;
    --cream: #FBF7F0;
    --sand: #EAE0D2;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: #e9e4db;
    font-family: "Poppins", sans-serif;
    color: var(--cocoa);
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px;
  }

  /* Screen-only helper bar */
  .toolbar {
    margin-bottom: 20px;
    text-align: center;
  }
  .toolbar p { color: #6b6459; font-size: 14px; margin: 0 0 10px; }
  .print-btn {
    font-family: "Poppins", sans-serif;
    background: var(--terracotta);
    color: #fff;
    border: none;
    padding: 12px 26px;
    border-radius: 999px;
    font-size: 15px;
    cursor: pointer;
    box-shadow: 0 6px 16px rgba(201,124,93,.35);
  }

  /* ---- The card ---- */
  .card {
    position: relative;
    width: 4in;
    height: 6in;
    background:
      radial-gradient(circle at 50% 8%, rgba(224,160,133,.14), transparent 45%),
      radial-gradient(circle at 85% 92%, rgba(156,170,133,.16), transparent 40%),
      var(--cream);
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 18px 45px rgba(74,63,53,.18);
    padding: 0.32in 0.4in 0.28in;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
  }

  /* Corner botanicals */
  .sprig {
    position: absolute;
    width: 1.5in;
    height: 1.5in;
    opacity: .9;
    pointer-events: none;
  }
  .sprig.tl { top: -0.18in; left: -0.22in; transform: rotate(0deg); }
  .sprig.br { bottom: -0.18in; right: -0.22in; transform: rotate(180deg); }

  .logo {
    width: 1.85in;
    height: auto;
    margin-top: 0;
  }
  .brand-sub {
    font-size: 8.5px;
    letter-spacing: .28em;
    text-transform: uppercase;
    color: var(--taupe);
    margin-top: -0.1in;
    margin-bottom: 0.08in;
  }

  .tagline {
    font-size: 9.5px;
    letter-spacing: .22em;
    text-transform: uppercase;
    color: var(--cocoa);
    font-weight: 500;
    line-height: 1.6;
    margin: 0.02in 0 0.1in;
  }

  .divider {
    color: var(--terracotta);
    font-size: 11px;
    margin: 0.02in 0;
  }

  /* Handwriting note lines */
  .notes {
    width: 100%;
    margin: 0.04in 0 0.1in;
  }
  .note-row {
    display: flex;
    align-items: flex-end;
    gap: 8px;
    margin: 0.1in 0;
  }
  .note-label {
    font-family: "Cormorant Garamond", serif;
    font-size: 15px;
    color: var(--taupe);
    white-space: nowrap;
  }
  .note-line {
    flex: 1;
    border-bottom: 1.4px dotted #c9bda9;
    height: 0.16in;
  }

  /* QR block */
  .qr-block {
    display: flex;
    align-items: center;
    gap: 0.16in;
    background: #fff;
    border: 1px solid var(--sand);
    border-radius: 12px;
    padding: 0.1in 0.14in;
    margin: 0.04in 0 0.02in;
    width: 100%;
  }
  .qr-block img { width: 0.85in; height: 0.85in; display: block; }
  .qr-text { text-align: left; }
  .qr-text .scan {
    font-family: "Cormorant Garamond", serif;
    font-weight: 600;
    font-size: 15px;
    color: var(--cocoa);
    line-height: 1.2;
    margin: 0 0 2px;
  }
  .qr-text .scan-sub {
    font-size: 9px;
    color: var(--taupe);
    line-height: 1.35;
  }

  .thankyou {
    font-family: "Dancing Script", cursive;
    font-size: 28px;
    color: var(--terracotta);
    margin: 0.09in 0 0.02in;
    line-height: 1;
  }

  .contact {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0.14in;
    font-size: 9.5px;
    color: var(--cocoa);
    margin-top: 0.06in;
  }
  .contact .item { display: flex; align-items: center; gap: 5px; }
  .contact svg { width: 12px; height: 12px; fill: var(--terracotta); }
  .contact .sep { color: var(--sand); }

  @media print {
    @page { size: 4in 6in; margin: 0; }
    body { background: #fff; padding: 0; display: block; }
    .toolbar { display: none; }
    .card {
      box-shadow: none;
      border-radius: 0;
      width: 4in;
      height: 6in;
    }
  }

  /* Clean, card-only view for previews (add #preview to the URL) */
  body.previewmode { padding: 0; background: #efe9df; }
  body.previewmode .toolbar { display: none; }
</style>
</head>
<body>

  <div class="toolbar">
    <p>Print at 4&quot;&times;6&quot;. Click below, then choose &ldquo;Save as PDF&rdquo; or your printer.</p>
    <button class="print-btn" onclick="window.print()">Print / Save as PDF</button>
  </div>

        <path d="M56 58 C66 56, 78 60, 82 68" />
      </g>

        <ellipse cx="68" cy="44" rx="8.5" ry="4.6" transform="rotate(-20 68 44)"/>
        <ellipse cx="82" cy="68" rx="9" ry="4.8" transform="rotate(-14 82 68)"/>
      </g>
      <g fill="#E0A085">
        <circle cx="24" cy="14" r="3.1"/>
        <circle cx="33" cy="10" r="2.6"/>
        <circle cx="16" cy="24" r="2.6"/>
      </g>
    </svg>

    <img class="logo" src="assets/jiya-logo.png" alt="Jiya Handmade Creations" />
    <div class="brand-sub">Handmade Creations</div>

    <div class="tagline">Handmade with love,<br/>made just for you.</div>

    <div class="divider">&#10084;</div>

    <div class="notes">
      <div class="note-row">
        <span class="note-label">For</span>
        <span class="note-line"></span>
      </div>
      <div class="note-row">
        <span class="note-label">A note</span>
        <span class="note-line"></span>
      </div>
    </div>

    <div class="qr-block">
      <img src="assets/qr-jiya-site.png" alt="Scan to shop Jiya" />
      <div class="qr-text">
        <p class="scan">Scan to shop</p>
        <p class="scan-sub">See all our handmade<br/>creations &amp; place an order</p>
      </div>
    </div>

    <div class="thankyou">Thank you</div>

    </div>
  </div>

  <script>
    if (location.hash === "#preview") document.body.classList.add("previewmode");
  </script>
</body>
</html>
