name: Sync products from Airtable

on:
  # Run automatically on a schedule (every 10 minutes)
  schedule:
    - cron: "*/10 * * * *"
  # Allow manual runs from the Actions tab
  workflow_dispatch:

# Let the job commit the synced data back to the repo
permissions:
  contents: write

# Avoid overlapping runs
concurrency:
  group: sync-airtable
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Sync from Airtable
        run: node scripts/sync-airtable.mjs
        env:
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
          AIRTABLE_BASE_ID: app27MQgngwYt6BMU
          AIRTABLE_TABLE: Products

      - name: Commit changes if any
        run: |
          git config user.name "jiya-sync-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No product changes to publish."
          else
            git commit -m "Sync products from Airtable [skip ci]"
            git push
          fi
